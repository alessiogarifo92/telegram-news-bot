name: Daily news digest

on:
  schedule:
    # 06:17 UTC = 08:17 CEST (summer time, March-October) / 07:17 CET
    # (winter time, November-March). GitHub's cron is always in UTC and
    # does not follow daylight saving: the local time shifts by an hour,
    # which for a morning digest makes no difference.
    #
    # Why :17 and not :00 - GitHub Actions schedules queue up together with
    # everyone else's, and round times are the most congested. Starting on
    # an odd minute reduces the typical delay.
    #
    # Why the morning - the window closing here already contains the entire
    # evening peak of US AI/tech announcements from the day before (which
    # tails off around 23:00 CET), so nothing is missed: the news arrives
    # all at once at breakfast instead of scattered through the day.
    #
    # In practice GitHub starts this schedule 4-9 hours late (measured over
    # August-October 2026: runs began between 10:30 and 15:30 UTC). So the
    # on-time start now comes from outside: a Claude Code Routine calls
    # workflow_dispatch every day at 08:17 Europe/Rome, and dispatched runs
    # start immediately. This cron stays as the fallback for a day the
    # Routine does not fire: the "already-sent" job below makes it skip
    # when today's digest has already gone out.
    - cron: '17 6 * * *'
  # Allows starting it by hand from the "Actions" tab, useful for testing.
  workflow_dispatch:
    inputs:
      mode:
        description: "What this run should do"
        type: choice
        default: send
        options:
          - send                 # the normal digest
          - reset-and-send       # forget everything, then send a full digest
          - reset-only           # forget everything and send nothing

# One run at a time, queued rather than cancelled: if the fallback schedule
# fires while the dispatched run is still going, it waits for it to finish,
# and the "already-sent" check then sees that run's success and skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # the already-sent check lists this workflow's runs

jobs:
  # Only a scheduled run can be a duplicate: a dispatched one (the daily
  # Routine, or a press of the button) always goes ahead.
  already-sent:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          done_today=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/daily-digest.yml/runs?status=success&created=%3E%3D${today}" \
            --jq '.total_count')
          echo "Successful runs today (UTC): ${done_today}"
          if [ "${done_today}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Today's digest already went out; the fallback schedule skips."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  send-digest:
    needs: already-sent
    if: needs.already-sent.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Memory between runs: the bot keeps the links/titles it already sent
      # in here (sent.json), so tomorrow it does not offer them again - and,
      # with TELEGRAM_TOPICS on, the ids of the forum topics it created
      # (topics.json), so it does not re-create them. Without this step,
      # "do not repeat" would only hold as long as the cron fires on time.
      #
      # The key contains run_id, so it never exists at restore time: the
      # restore always falls through to restore-keys (a prefix match, which
      # picks the most recent cache), and the post-job save always writes a
      # fresh entry. This is the standard pattern for a cache that rolls
      # forward instead of freezing on its first write.
      - name: Restore deduplication state
        uses: actions/cache@v6
        with:
          path: .state
          key: digest-state-${{ github.run_id }}
          restore-keys: |
            digest-state-

      # Escape hatch for the memory above. The restored state is replaced
      # by an empty one, which the post-job cache save then writes under a
      # new key - and that is the key the next run restores, so the reset
      # holds instead of lasting a single run. The file has to exist and be
      # valid JSON: actions/cache saves nothing at all for a missing path,
      # which would leave the old state as the newest cache and quietly
      # undo the reset.
      #
      # "reset-only" exists because the two halves are wanted separately:
      # resetting before the scheduled morning digest should NOT fire a
      # second full digest at the moment you press the button.
      - name: Forget the stories already sent
        if: inputs.mode == 'reset-and-send' || inputs.mode == 'reset-only'
        run: |
          mkdir -p .state
          echo '{}' > .state/sent.json
          # topics.json is left alone on purpose: forgetting the topic ids
          # would make the next run create a second set of same-named
          # topics. This forgets sent stories, not the folders.

      - if: inputs.mode != 'reset-only'
        run: pip install -r requirements.txt

      - name: Run digest bot
        if: inputs.mode != 'reset-only'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: "true" to split the digest across three forum topics.
          # Needs TELEGRAM_CHAT_ID to be a supergroup (-100...) with Topics
          # on and the bot an admin there. Unset -> empty -> flat single
          # chat, as before. See README "Folders (Telegram Topics)".
          TELEGRAM_TOPICS: ${{ secrets.TELEGRAM_TOPICS }}
          # The ids of the three topics, fixed here so they do not depend on
          # the cache: actions/cache drops entries unused for 7 days, and
          # losing topics.json made the bot create a second set of topics.
          # Not secret - a thread id is useless without the bot token.
          # Only read when TELEGRAM_TOPICS is on.
          TELEGRAM_TOPIC_IDS: '{"generali": 3190, "tech_ai": 3191, "finanza": 3192}'
          # Optional: third translation fallback for Dutch headlines. If the
          # secret is not set the variable arrives empty and the bot simply
          # skips that attempt.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python news_digest_bot.py

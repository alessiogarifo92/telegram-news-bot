name: Keepalive

# GitHub automatically disables workflows with a "schedule" trigger after
# 60 days without activity (a commit) on the repo. This job runs once a
# month and makes a small "dummy" commit (updating a file with the current
# date), which counts as activity and resets the timer for ALL scheduled
# workflows in the repo - including this one and daily-digest.yml.

on:
  schedule:
    - cron: '0 3 1 * *'   # once a month, on the 1st at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update the keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit and push (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --cached --quiet || git commit -m "chore: keepalive (avoid the automatic 60-day shutdown)"
          git push
